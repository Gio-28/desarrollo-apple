{% extends "base.html" %}
{% block title %}Verificacion en dos pasos - Apple Travel{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <img src="/static/img/logo.png" alt="Apple Travel" class="login-logo" />
    <h1>Verifica tu identidad</h1>
    <p class="muted">Abre Google Authenticator en tu celular y escribe el codigo de 6 digitos de <strong>Apple Travel</strong>.</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/verificar-2fa" class="auth-form" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <label class="form-field">
        <span>Codigo de 6 digitos</span>
        <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus autocomplete="one-time-code" />
      </label>
      <label class="form-field-checkbox">
        <input type="checkbox" name="recordar_dispositivo" value="1" />
        <span>Confiar en este dispositivo por 30 dias (no pedir codigo aqui la proxima vez)</span>
      </label>
      <button type="submit" class="btn-primary btn-block">Verificar</button>
    </form>

    <p class="tiny muted"><a href="/logout" class="btn-link">Cancelar</a></p>
  </div>
</div>
{% endblock %}
